name: WebIsland
options:
  bundleIdPrefix: com.borasarang
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.0.0
targets:
  WebIsland:
    type: application
    platform: macOS
    bundleId: com.borasarang.WebIsland
    deploymentTarget: "14.0"
    info:
      path: Info.plist
      properties:
        CFBundleName: Web Island
        CFBundleDisplayName: Web Island
        CFBundleIdentifier: com.borasarang.WebIsland
        CFBundleShortVersionString: 0.1.0
        CFBundleVersion: 0.1.0
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        CFBundleLocalizations: [en, ko]
        CFBundleIconName: AppIcon
        NSHumanReadableCopyright: © Web Island
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    sources:
      - path: Sources
    resources:
      - path: Assets/WebIsland.xcassets
      - path: Resources/en.lproj/Localizable.strings
      - path: Resources/ko.lproj/Localizable.strings
      - path: Resources/en.lproj/InfoPlist.strings
      - path: Resources/ko.lproj/InfoPlist.strings
    dependencies:
      - package: KeyboardShortcuts
    settings:
      base:
        PRODUCT_NAME: WebIsland
        PRODUCT_BUNDLE_IDENTIFIER: com.borasarang.WebIsland
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "5.9"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "WebIsland Development"
  WebIslandTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
    sources:
      - path: Tests
    dependencies:
      - target: WebIsland
schemes:
  WebIsland:
    build:
      targets:
        WebIsland: all
        WebIslandTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - WebIslandTests
